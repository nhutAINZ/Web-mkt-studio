<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>làm clip đồ chơi - Lumina Animation Film</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #hud-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-family: monospace;
      font-weight: 600;
    }
    #subtitles-bar {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      background: rgba(7, 7, 10, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .sub-text {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub-speaker {
      color: #f59e0b;
      font-weight: 700;
      font-family: monospace;
      font-size: 11px;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    #btn-download-video {
      position: absolute;
      top: 14px;
      right: 16px;
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    #btn-download-video:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="hud-top">
      <div class="badge" style="color: #f59e0b;">
        ⚡ LUMINA &bull; BRICK-TOY
      </div>
      <div class="badge" id="hud-tc">
        TC: 00:00.00 / 30s
      </div>
    </div>

    <button id="btn-download-video" onclick="recordAndDownloadVideo()">
      <span>💾</span>
      <span id="btn-download-text">Tải Video MP4</span>
    </button>

    <div id="subtitles-bar">
      <div class="sub-text">
        <span class="sub-speaker" id="sub-speaker">VOICEOVER</span>
        <span id="sub-content">Đang khởi tạo...</span>
      </div>
      <div class="badge" id="hud-shot" style="margin: 0; padding: 3px 8px; font-size: 10px;">
        SHOT 1/6
      </div>
    </div>

    <canvas id="c" width="1280" height="720"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hudTc = document.getElementById('hud-tc');
    const hudShot = document.getElementById('hud-shot');
    const subSpeaker = document.getElementById('sub-speaker');
    const subContent = document.getElementById('sub-content');

    window.DUR = 30;
    window.READY = false;

    const SHOTS = [{"num": 1, "title": "Shot 1: Mở Đầu Đại Cảnh (Establishing Shot)", "time": "00:00 - 00:05", "camera": "Dolly In 4K", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, wide establishing shot of [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại] in bright modern living room, cinematic lighting", "vo": "Nữ truyền cảm: Mỗi buổi sáng, một thế giới diệu kỳ đang chờ bé khám phá...", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20wide%20establishing%20shot%20of%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%20in%20bright%20modern%20living%20room%2C%20cinematic%20lighting?width=1280&height=720&nologo=true&seed=22228", "fallback_img": "https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?auto=format&fit=crop&w=1280&q=80", "status": "ready"}, {"num": 2, "title": "Shot 2: Cơ Chế Cơ Khí & Biến Hình (Mechanism)", "time": "00:05 - 00:10", "camera": "Orbit 360° Macro", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, macro shot of [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại] transforming and assembling mechanical gears in mid-air", "vo": "Nữ truyền cảm: Tự động bung cánh lượn biến hình thành chiến binh mạnh mẽ...", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20macro%20shot%20of%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%20transforming%20and%20assembling%20mechanical%20gears%20in%20mid-air?width=1280&height=720&nologo=true&seed=22229", "fallback_img": "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1280&q=80", "status": "ready"}, {"num": 3, "title": "Shot 3: Hành Động Kịch Tính (Dynamic Action)", "time": "00:10 - 00:18", "camera": "Dutch Tilt 124 BPM", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, high speed dynamic action shot of [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại] racing through futuristic obstacle track, motion blur", "vo": "Âm nhạc: Trống snare dồn dập, tiếng vút gió sound design sinh động...", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20high%20speed%20dynamic%20action%20shot%20of%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%20racing%20through%20futuristic%20obstacle%20track%2C%20motion%20blur?width=1280&height=720&nologo=true&seed=22230", "fallback_img": "https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&w=1280&q=80", "status": "ready"}, {"num": 4, "title": "Shot 4: Biểu Cảm Em Bé & Tương Tác (Reaction)", "time": "00:18 - 00:22", "camera": "Medium Close-up Warm", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, joyful cute child smiling happily playing with [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại], warm soft golden hour lighting", "vo": "Nữ truyền cảm: Nuôi dưỡng trí tưởng tượng không giới hạn cho thiên tài nhí...", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20joyful%20cute%20child%20smiling%20happily%20playing%20with%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%2C%20warm%20soft%20golden%20hour%20lighting?width=1280&height=720&nologo=true&seed=22231", "fallback_img": "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=1280&q=80", "status": "ready"}, {"num": 5, "title": "Shot 5: Chi Tiết Phụ Kiện & An Toàn (Showcase)", "time": "00:22 - 00:26", "camera": "Top-down Flatlay", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, flatlay top down view of [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại] accessories, packaging box, certified clean design", "vo": "Nữ tự tin: Chất liệu nhựa nguyên sinh ABS an toàn 100% không BPA đạt chuẩn quốc tế...", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20flatlay%20top%20down%20view%20of%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%20accessories%2C%20packaging%20box%2C%20certified%20clean%20design?width=1280&height=720&nologo=true&seed=22232", "fallback_img": "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1280&q=80", "status": "ready"}, {"num": 6, "title": "Shot 6: Kêu Gọi Mua Hàng & Khuyến Mãi (CTA)", "time": "00:26 - 00:30", "camera": "Hero Center Glow", "visual_prompt": "Lego stop-motion brickfilm style, glossy ABS plastic toy blocks, realistic miniature studio lighting, depth of field 12fps aesthetic 8k, hero product pose of complete [Character: Nhân Vật Chính, Mô hình đồ chơi thông minh, Vỏ kim loại bóng, Mắt kính LED xanh, Thiết kế cơ khí hiện đại] standing on glossy pedestal, glowing logo", "vo": "Nữ tự tin: Đặt hàng ngay hôm nay nhận ưu đãi giảm 30% và quà tặng hấp dẫn!", "img": "https://image.pollinations.ai/prompt/Lego%20stop-motion%20brickfilm%20style%2C%20glossy%20ABS%20plastic%20toy%20blocks%2C%20realistic%20miniature%20studio%20lighting%2C%20depth%20of%20field%2012fps%20aesthetic%208k%2C%20hero%20product%20pose%20of%20complete%20%5BCharacter%3A%20Nh%C3%A2n%20V%E1%BA%ADt%20Ch%C3%ADnh%2C%20M%C3%B4%20h%C3%ACnh%20%C4%91%E1%BB%93%20ch%C6%A1i%20th%C3%B4ng%20minh%2C%20V%E1%BB%8F%20kim%20lo%E1%BA%A1i%20b%C3%B3ng%2C%20M%E1%BA%AFt%20k%C3%ADnh%20LED%20xanh%2C%20Thi%E1%BA%BFt%20k%E1%BA%BF%20c%C6%A1%20kh%C3%AD%20hi%E1%BB%87n%20%C4%91%E1%BA%A1i%5D%20standing%20on%20glossy%20pedestal%2C%20glowing%20logo?width=1280&height=720&nologo=true&seed=22233", "fallback_img": "https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?auto=format&fit=crop&w=1280&q=80", "status": "ready"}];
    const loadedImages = [];
    let imagesLoadedCount = 0;

    SHOTS.forEach((shot, index) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = shot.img;
      img.onload = () => {
        imagesLoadedCount++;
        if (imagesLoadedCount >= SHOTS.length) window.READY = true;
      };
      img.onerror = () => {
        img.src = shot.fallback_img;
        imagesLoadedCount++;
        if (imagesLoadedCount >= SHOTS.length) window.READY = true;
      };
      loadedImages.push(img);
    });

    window.render = function(t) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const shotDuration = window.DUR / SHOTS.length;
      const currentShotIndex = Math.min(SHOTS.length - 1, Math.floor(t / shotDuration));
      const shotProgress = (t % shotDuration) / shotDuration;
      const currentShot = SHOTS[currentShotIndex];
      const img = loadedImages[currentShotIndex];

      if (img && img.complete) {
        ctx.save();
        const scale = 1.0 + shotProgress * 0.12;
        const panX = (shotProgress - 0.5) * 40;
        const panY = (shotProgress - 0.5) * 20;

        ctx.translate(w / 2 + panX, h / 2 + panY);
        ctx.scale(scale, scale);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#0f0f15';
        ctx.fillRect(0, 0, w, h);
      }

      // Cinematic Vignette
      const grad = ctx.createRadialGradient(w/2, h/2, h * 0.45, w/2, h/2, w * 0.7);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.65)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Timecode & HUD (Clean Bullet Character)
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      const ms = Math.floor((t % 1) * 100);
      hudTc.innerText = `TC: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')} / 30s`;
      hudShot.innerText = `SHOT ${currentShotIndex + 1}/${SHOTS.length} • ${currentShot.camera}`;
      
      const voText = currentShot.vo.split(':');
      if (voText.length > 1) {
        subSpeaker.innerText = voText[0].trim();
        subContent.innerText = voText[1].trim();
      } else {
        subSpeaker.innerText = 'NARRATOR';
        subContent.innerText = currentShot.vo;
      }
    };

    let startTime = performance.now();
    function animate() {
      const now = performance.now();
      const elapsed = ((now - startTime) / 1000) % window.DUR;
      window.render(elapsed);
      requestAnimationFrame(animate);
    }
    animate();

    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    function recordAndDownloadVideo() {
      const btn = document.getElementById('btn-download-video');
      const btnText = document.getElementById('btn-download-text');
      if (isRecording) return;

      isRecording = true;
      btnText.innerText = 'Đang quay video...';
      btn.style.background = '#ef4444';
      recordedChunks = [];

      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'film_1794724209_1d4b63_video.webm';
        a.click();
        URL.revokeObjectURL(url);

        isRecording = false;
        btnText.innerText = 'Tải Video MP4';
        btn.style.background = '#f59e0b';
      };

      startTime = performance.now();
      mediaRecorder.start();
      setTimeout(() => {
        mediaRecorder.stop();
      }, Math.min(15000, window.DUR * 1000));
    }
  </script>
</body>
</html>
