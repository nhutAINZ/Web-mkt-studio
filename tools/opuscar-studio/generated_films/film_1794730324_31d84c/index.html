        pctText.innerText = pct + '%';
        statusText.innerText = `Đang render MP4: ${pct}% (${Math.floor(elapsed)}s/${window.DUR}s)...`;
        if (elapsed >= window.DUR) {
          clearInterval(renderInterval);
          if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }
      }, 200);
    }
  </script>
</body>
</html>
